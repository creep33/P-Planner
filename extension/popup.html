<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>P-Planner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <section id="list-view">
    <header class="bar">
      <h1>P-Planner</h1>
      <span id="running-pill" class="pill" hidden></span>
    </header>
    <form id="new-form" class="row">
      <input id="new-name" placeholder="Nuevo proyecto" maxlength="60" autocomplete="off" required>
      <button type="submit">Añadir</button>
    </form>
    <ul id="projects"></ul>
    <p id="empty" class="empty" hidden>Sin proyectos todavía. Crea uno arriba.</p>
    <footer class="foot">
      <button id="export-csv" class="link" type="button">Exportar CSV</button>
      <button id="export-json" class="link" type="button">Backup JSON</button>
      <button id="import-json" class="link" type="button">Importar</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
    </footer>
  </section>

  <section id="detail-view" hidden>
    <header class="bar">
      <button id="back" class="icon" type="button" title="Volver" aria-label="Volver">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="d-name" class="editable" title="Click para renombrar"></h1>
    </header>

    <div id="d-clock" class="clock">00:00:00</div>
    <button id="d-toggle" class="big" type="button">Start</button>

    <div class="stats">
      <div><span>Hoy</span><strong id="d-today">0h 00m</strong></div>
      <div><span>Esta semana</span><strong id="d-week">0h 00m</strong></div>
    </div>

    <h2>Ajuste manual</h2>
    <form id="manual-form" class="manual">
      <select id="m-sign" aria-label="Sumar o restar">
        <option value="1">+</option>
        <option value="-1">−</option>
      </select>
      <input id="m-h" type="number" min="0" max="999" placeholder="h" aria-label="Horas">
      <input id="m-m" type="number" min="0" max="59" placeholder="min" aria-label="Minutos">
      <input id="m-date" type="date" aria-label="Fecha">
      <button type="submit">Aplicar ajuste</button>
    </form>

    <h2>Últimos días</h2>
    <ul id="d-days" class="days"></ul>

    <button id="d-delete" class="link danger" type="button">Borrar proyecto</button>
  </section>

  <div id="toast" role="status" hidden></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
