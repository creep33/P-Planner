<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>P-Planner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <section id="list-view">
    <header class="bar">
      <button id="up" class="icon" type="button" title="Back" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="l-title">P-Planner</h1>
      <span id="running-pill" class="pill" hidden></span>
      <button id="f-settings-btn" class="icon" type="button" title="Folder settings" aria-label="Folder settings" aria-expanded="false" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <div id="folder-info" hidden>
      <div class="stats three">
        <div><span>Total</span><strong id="f-total">0h 00m</strong></div>
        <div><span>Today</span><strong id="f-today">0h 00m</strong></div>
        <div><span>This week</span><strong id="f-week">0h 00m</strong></div>
      </div>
      <div id="f-settings" class="settings" hidden>
        <h2>Location</h2>
        <select id="f-parent" class="full" aria-label="Location"></select>
      </div>
    </div>

    <form id="new-form" class="row">
      <input id="new-name" placeholder="New project or folder" maxlength="60" autocomplete="off">
      <button type="submit">Add</button>
      <button id="new-folder" class="secondary" type="button" title="New folder" aria-label="New folder">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h9A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="M12 11v5M9.5 13.5h5"/></svg>
      </button>
    </form>
    <ul id="projects"></ul>
    <p id="empty" class="empty" hidden></p>
    <footer id="root-foot" class="foot">
      <button id="export-json" class="link" type="button">Export</button>
      <button id="import-json" class="link" type="button">Import</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
    </footer>
    <footer id="folder-foot" class="foot" hidden>
      <button id="f-delete" class="link danger" type="button">Delete folder</button>
    </footer>
  </section>

  <section id="detail-view" hidden>
    <header class="bar">
      <button id="back" class="icon" type="button" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="d-name" class="editable" title="Click to rename"></h1>
    </header>

    <div id="d-clock" class="clock">00:00:00</div>
    <button id="d-toggle" class="big" type="button">Start</button>

    <div class="stats">
      <div><span>Today</span><strong id="d-today">0h 00m</strong></div>
      <div><span>This week</span><strong id="d-week">0h 00m</strong></div>
    </div>

    <h2>Manual adjustment</h2>
    <form id="manual-form" class="manual">
      <select id="m-sign" aria-label="Add or subtract">
        <option value="1">+</option>
        <option value="-1">−</option>
      </select>
      <input id="m-h" type="number" min="0" max="999" placeholder="h" aria-label="Hours">
      <input id="m-m" type="number" min="0" max="59" placeholder="min" aria-label="Minutes">
      <input id="m-date" type="date" aria-label="Date">
      <button type="submit">Apply adjustment</button>
    </form>

    <h2>Folder</h2>
    <select id="d-folder" class="full" aria-label="Folder"></select>

    <h2>Recent days</h2>
    <ul id="d-days" class="days"></ul>

    <button id="d-delete" class="link danger" type="button">Delete project</button>
  </section>

  <div id="toast" role="status" hidden></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
